name: Teitunnel

# Follows Teitunnel's releases: every three hours (or by hand) it checks the latest
# release, and for a new one renders the cask and formula from the release's
# SHA256SUMS.txt (after verifying its build provenance), tests them on macOS and Linux,
# and only then pushes them.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

env:
  SOURCE: teispace/teitunnel

jobs:
  render:
    name: Render the latest release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.render.outputs.version }}
      changed: ${{ steps.render.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: render
        run: |
          tag=$(gh release view -R "$SOURCE" --json tagName -q .tagName)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Unexpected release tag: $tag"; exit 1
          fi
          version=${tag#v}
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/teitunnel.rb)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "$current" ]; then
            echo "Up to date ($version)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$tag" -R "$SOURCE" -p SHA256SUMS.txt -D "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/SHA256SUMS.txt" -R "$SOURCE" \
            --signer-workflow "$SOURCE/.github/workflows/release.yml"
          node scripts/teitunnel.mjs "$version" "$RUNNER_TEMP/SHA256SUMS.txt"
          git diff --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.render.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered
          path: |
            Casks/teitunnel.rb
            Formula/teitunnel-cli.rb
          if-no-files-found: error
          retention-days: 7

  test:
    needs: render
    if: needs.render.outputs.changed == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      artifact: rendered

  publish:
    name: Publish
    needs: [render, test]
    if: needs.render.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rendered
      - env:
          VERSION: ${{ needs.render.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks Formula
          git commit -m "teitunnel ${VERSION}"
          git push
