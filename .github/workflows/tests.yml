name: Tests

# Lints the cask and formula with Homebrew's own checks, then installs, tests and
# uninstalls them on macOS and Linux. update.yml runs it on a freshly rendered release
# (the `artifact` input) before pushing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      artifact:
        description: Rendered Casks/ and Formula/ to test instead of the checked-in ones
        type: string
        default: ""

permissions:
  contents: read

jobs:
  render:
    name: Renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test scripts/

  brew:
    name: Homebrew (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: inputs.artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # main
      - name: Style and audit
        run: |
          brew style teispace/tap
          brew audit --strict --online --formula teispace/tap/teitunnel-cli
          if [ "$RUNNER_OS" = macOS ]; then
            brew audit --strict --online --cask teispace/tap/teitunnel
          fi
      - name: Formula
        run: |
          brew install --formula teispace/tap/teitunnel-cli
          brew test teispace/tap/teitunnel-cli
          brew uninstall --formula teispace/tap/teitunnel-cli
      - name: Cask
        if: runner.os == 'macOS'
        run: |
          brew install --cask teispace/tap/teitunnel
          test -d /Applications/Teitunnel.app
          codesign --verify --deep --strict /Applications/Teitunnel.app
          spctl --assess --type execute -v /Applications/Teitunnel.app
          "$(brew --prefix)/bin/teitunnel-cli" --version
          brew uninstall --cask --zap teispace/tap/teitunnel
          test ! -e /Applications/Teitunnel.app
